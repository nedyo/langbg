name: Deploy

# Publishes web/ to https://langbg.com (Cloudflare Workers static assets, no Worker script).
# Runs after every push to main, after every successful Catalog run (its commit is pushed with
# GITHUB_TOKEN, which starts no `push` workflow), or by hand (Actions tab -> Deploy -> Run workflow).
# The tests run first; nothing is published if they fail.
#
# Repository settings (Settings -> Secrets and variables -> Actions):
#   secrets   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
#   variable  CF_BEACON_TOKEN  (Cloudflare Web Analytics; public, it ends up in every page)

on:
  push:
    branches: [main]
  workflow_run:
    workflows: [Catalog]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    uses: ./.github/workflows/test.yml

  deploy:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: production
      url: https://langbg.com
    steps:
      # The commit the tests ran on. After a Catalog run that is main's newest, with the catalog commit.
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-web

      - name: Build
        working-directory: web
        env:
          CF_BEACON_TOKEN: ${{ vars.CF_BEACON_TOKEN }}
        run: pnpm build

      # `pnpm run`, not `pnpm deploy`: the latter is a pnpm command of its own.
      - name: Deploy to Cloudflare
        working-directory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm run deploy
