<!doctype html>
<html lang="bg">
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        color-scheme: light dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 12px 16px 16px;
        font: 12px/1.5 Inter, system-ui, sans-serif;
        color: var(--figma-color-text, #1e1e1e);
        background: var(--figma-color-bg, #fff);
        display: flex;
        flex-direction: column;
        gap: 12px;
        min-height: 100vh;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }
      h1 {
        margin: 0;
        font-size: 13px;
        font-weight: 600;
      }
      h2 {
        margin: 0 0 4px;
        font-size: 12px;
        font-weight: 600;
      }
      .langs {
        display: inline-flex;
        border: 1px solid var(--figma-color-border, #e6e6e6);
        border-radius: 6px;
        overflow: hidden;
      }
      .langs button {
        border: 0;
        padding: 2px 10px;
        font: inherit;
        font-size: 11px;
        color: var(--figma-color-text-secondary, #757575);
        background: transparent;
        cursor: pointer;
      }
      .langs button[aria-pressed="true"] {
        color: var(--figma-color-text, #1e1e1e);
        background: var(--figma-color-bg-secondary, #f5f5f5);
        font-weight: 600;
      }
      .muted {
        color: var(--figma-color-text-secondary, #757575);
      }
      pre {
        margin: 0;
        padding: 10px 12px;
        overflow-x: auto;
        font: 11px/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        background: var(--figma-color-bg-secondary, #f5f5f5);
        border-radius: 6px;
        /* The panel is narrow: long comments wrap instead of scrolling sideways. */
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .copy-row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 8px;
      }
      .copy {
        border: 0;
        border-radius: 6px;
        padding: 6px 12px;
        font: inherit;
        font-weight: 600;
        color: var(--figma-color-text-onbrand, #fff);
        background: var(--figma-color-bg-brand, #0d99ff);
        cursor: pointer;
      }
      button:focus-visible {
        outline: 2px solid var(--figma-color-border-selected, #0d99ff);
        outline-offset: 1px;
      }
      #note {
        margin: 0;
        white-space: pre-line;
      }
      footer {
        margin-top: auto;
        font-size: 11px;
      }
      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>langBG Handoff</h1>
      <div class="langs" role="group" id="langs">
        <button type="button" data-lang="bg" lang="bg">БГ</button>
        <button type="button" data-lang="en" lang="en">EN</button>
      </div>
    </header>

    <p id="status" class="muted" role="status"></p>

    <section id="result" hidden>
      <pre id="css" translate="no" tabindex="0"></pre>
      <div class="copy-row">
        <button type="button" class="copy" id="copy"></button>
        <span id="copy-status" class="muted" role="status"></span>
      </div>
    </section>

    <section id="note-section" hidden>
      <h2 id="note-title"></h2>
      <p id="note"></p>
    </section>

    <footer class="muted" id="read-only"></footer>

    <script>
      /* SCRIPT */
    </script>
  </body>
</html>
